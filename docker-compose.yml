services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: scrumy
      POSTGRES_PASSWORD: scrumy
      POSTGRES_DB: scrumy
    ports:
      - "5433:5432"
    volumes:
      - scrumy_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scrumy -d scrumy"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://scrumy:scrumy@db:5432/scrumy?schema=public
      NODE_ENV: production
    ports:
      - "3001:3000"

volumes:
  scrumy_db_data:
