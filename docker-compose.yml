services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: scrumy
      POSTGRES_PASSWORD: scrumy
      POSTGRES_DB: scrumy
    ports:
      - "5433:5432"
    volumes:
      - scrumy_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scrumy -d scrumy"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://scrumy:scrumy@db:5432/scrumy?schema=public
      NODE_ENV: production
      WORKSPACE_ROOT: /workspaces
      # Fuer LLM-Profile mit "env:NAME"-Referenz statt Schluessel in der DB.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      # Portbereich fuer die Frontend-Vorschau (siehe src/lib/preview.ts). Jede
      # laufende Vorschau bekommt einen freien Port aus diesem Bereich und
      # laeuft dort an ihrer eigenen Seitenwurzel – kein Pfad-Proxy noetig, das
      # iframe zeigt direkt auf <host>:<port>. Deshalb muss der ganze Bereich
      # veroeffentlicht sein, nicht nur der App-Port.
      PREVIEW_PORT_RANGE_START: "4100"
      PREVIEW_PORT_RANGE_END: "4119"
    ports:
      - "3001:3000"
      - "4100-4119:4100-4119"
    volumes:
      # Ueberwiegend lesend (Commit-Historie und Diffs in den Nachweisen), seit
      # der Frontend-Vorschau aber auch schreibend: `npm install` und der
      # Dev-Server legen node_modules/Build-Cache im Arbeitsverzeichnis an.
      - scrumy_workspaces:/workspaces

  # Fuehrt die eigentliche Agenten-Arbeit aus (Job-Queue via graphile-worker),
  # komplett getrennt vom Next.js-App-Container. Skaliert horizontal unabhaengig
  # von "app" ueber die Anzahl Replicas, z.B.:
  #   docker compose up -d --scale worker=3
  worker:
    build: .
    restart: unless-stopped
    command: ["npx", "tsx", "worker/index.ts"]
    # Ein Agenten-Schritt ist ein LLM-Aufruf und dauert Minuten. Ohne Wartezeit
    # killt Docker den Worker nach 10s mitten im Job – graphile-worker kann den
    # Job dann nicht freigeben, und er haengt bis zum Ablauf seiner Sperre
    # (Standard: 4 Stunden). Mit Gnadenfrist laeuft der Schritt zu Ende und der
    # Worker faehrt sauber herunter.
    stop_grace_period: 300s
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://scrumy:scrumy@db:5432/scrumy?schema=public
      NODE_ENV: production
      WORKSPACE_ROOT: /workspaces
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
    volumes:
      # Schreibend: hier committen die Agenten.
      - scrumy_workspaces:/workspaces

volumes:
  scrumy_db_data:
  scrumy_workspaces:
