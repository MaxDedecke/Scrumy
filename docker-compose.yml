services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: scrumy
      POSTGRES_PASSWORD: scrumy
      POSTGRES_DB: scrumy
    ports:
      - "5433:5432"
    volumes:
      - scrumy_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scrumy -d scrumy"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    # Startet zunaechst als root (docker/app-entrypoint.sh), damit der
    # gemountete Docker-Socket nutzbar wird, dann sofort auf "nextjs" fallen
    # gelassen (siehe dort und src/lib/preview.ts). Ein ueberschriebenes
    # ENTRYPOINT verwirft das im Dockerfile gebackene CMD, deshalb hier
    # explizit erneut mitgeben – app-entrypoint.sh reicht es per "$@" durch.
    user: root
    entrypoint: ["/app/docker/app-entrypoint.sh"]
    command: ["sh", "-c", "npx prisma migrate deploy && npm run start"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://scrumy:scrumy@db:5432/scrumy?schema=public
      NODE_ENV: production
      WORKSPACE_ROOT: /workspaces
      # Fuer LLM-Profile mit "env:NAME"-Referenz statt Schluessel in der DB.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      # Verschlüsselt Connector-Zugangsdaten (z.B. ein direkt im Formular
      # eingegebenes GitHub-PAT statt einer env:NAME-Referenz), siehe
      # src/lib/secret.ts. MUSS mit dem Wert im "worker"-Service unten
      # übereinstimmen – app verschlüsselt beim Speichern, worker
      # entschlüsselt beim Pushen.
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      # Frontend-Vorschau (siehe src/lib/preview.ts): jede laufende Vorschau
      # ist ein eigener, ressourcenbegrenzter Sibling-Container aus dem Image
      # unten, verbunden mit "app" ueber ein eigenes, isoliertes Netz (siehe
      # "networks" unten – NICHT das Netz von db/worker) und dasselbe
      # Workspace-Volume (nur lesend fuer die Erkennung gebraucht; der
      # Vorschau-Container selbst schreibt node_modules/Build-Cache).
      PREVIEW_DOCKER_NETWORK: scrumy_preview
      PREVIEW_WORKSPACE_VOLUME: scrumy_scrumy_workspaces
      PREVIEW_RUNNER_IMAGE: scrumy-preview-runner
      # Portbereich, aus dem jede laufende Vorschau einen Port bekommt. Jeder
      # Vorschau-Container veroeffentlicht seinen eigenen Port selbst (siehe
      # "docker run -p" in src/lib/preview.ts) – NICHT "app" hier drunter,
      # das wuerde denselben Hostport doppelt belegen wollen.
      PREVIEW_PORT_RANGE_START: "4100"
      PREVIEW_PORT_RANGE_END: "4119"
    ports:
      - "3001:3000"
    volumes:
      # Lesend: Commit-Historie/Diffs in den Nachweisen, und die
      # Frontend-Erkennung der Vorschau (package.json/index.html suchen).
      - scrumy_workspaces:/workspaces
      # Fuer die Frontend-Vorschau: startet Sibling-Container auf demselben
      # Docker-Host. Das ist praktisch aequivalent zu Root-Rechten auf dem
      # Host (wer den Socket erreicht, kann beliebige Container starten) –
      # ein bewusster, dokumentierter Kompromiss fuer dieses interne Tool,
      # kein Schritt, der leichtfertig auf eine oeffentlich erreichbare
      # Instanz uebertragen werden sollte.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - default
      - scrumy_preview

  # Lokal gehostetes Modell fuer OLLAMA-LlmProfile (siehe src/lib/llm.ts,
  # Default-Base-URL http://ollama:11434 - genau dieser Servicename) statt
  # Cloud-Anbieter. Bewusst hinter einem eigenen Profile ("ollama"), NICHT im
  # Default-"docker compose up": auf einer GPU-losen Maschine (z.B. dieser
  # Dev-Host) wuerde die "deploy.resources"-GPU-Reservierung den Start
  # verweigern. Start explizit mit:
  #   docker compose --profile ollama up -d
  # Gedacht v.a. fuer einen RunPod-GPU-Pod (siehe README, Abschnitt
  # "RunPod-Deployment") mit eigenem Modell statt Cloud-Kosten.
  #
  # Kein "external"-Volume wie db_data/workspaces oben: der Modell-Cache ist
  # reproduzierbar (erneuter Pull) und keine Kundendaten - ein neu erzeugtes
  # Volume nach Projektname-Wechsel ist hier kein Datenverlust-Risiko.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles: ["ollama"]
    environment:
      # Ueberschreibbar in .env - siehe .env.example. Klein genug, um auf
      # einer einzelnen GPU schnell zu pullen; bei mehr VRAM gerne groesser.
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Eigener Entrypoint statt des Image-Standards ("ollama serve"): pullt
    # OLLAMA_MODEL einmalig beim Start automatisch, damit nach "docker compose
    # --profile ollama up -d" nicht erst noch manuell "ollama pull" noetig
    # ist - bei einer abgerechneten GPU-Stunde soll moeglichst wenig davon
    # fuers Setup drauf gehen. Erneuter Start pullt nicht neu (Ollama prueft
    # selbst, ob das Modell schon lokal liegt).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        sleep 3
        ollama pull "$$OLLAMA_MODEL" || true
        wait

  # Fuehrt die eigentliche Agenten-Arbeit aus (Job-Queue via graphile-worker),
  # komplett getrennt vom Next.js-App-Container. Skaliert horizontal unabhaengig
  # von "app" ueber die Anzahl Replicas, z.B.:
  #   docker compose up -d --scale worker=3
  worker:
    build: .
    restart: unless-stopped
    # Wie "app" (siehe dort und docker/app-entrypoint.sh): startet kurz als
    # root, um den gemounteten Docker-Socket nutzbar zu machen, faellt dann
    # sofort auf "nextjs" zurueck. Der Worker braucht das fuer die
    # automatischen Pruefungen (siehe src/lib/testRun.ts) – QA laesst dort
    # echte "npm ci"/"npm test"-Laeufe in einem eigenen, ressourcenbegrenzten
    # Sibling-Container laufen, statt sich auf ein Modellurteil ueber einen
    # Diff zu verlassen.
    user: root
    entrypoint: ["/app/docker/app-entrypoint.sh"]
    command: ["npx", "tsx", "worker/index.ts"]
    # Ein Agenten-Schritt ist ein LLM-Aufruf und dauert Minuten. Ohne Wartezeit
    # killt Docker den Worker nach 10s mitten im Job – graphile-worker kann den
    # Job dann nicht freigeben, und er haengt bis zum Ablauf seiner Sperre
    # (Standard: 4 Stunden). Mit Gnadenfrist laeuft der Schritt zu Ende und der
    # Worker faehrt sauber herunter.
    stop_grace_period: 300s
    depends_on:
      db:
        condition: service_healthy
    # Reicht neben den bekannten Standardvariablen auch projektspezifische
    # Token-Namen wie KUNDE_A_GITHUB_TOKEN an den Worker durch. `environment`
    # unten hat Vorrang und behaelt die containerinternen DB-/Pfadangaben.
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://scrumy:scrumy@db:5432/scrumy?schema=public
      NODE_ENV: production
      WORKSPACE_ROOT: /workspaces
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      # HTTPS-Schreibzugriff auf GitHub-Repositories. Der Token wird nur dem
      # Git-Prozess via Askpass gegeben und nie in der Remote-URL gespeichert.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Siehe Kommentar bei "app" oben – hier der Gegenpart, der einen per UI
      # verschlüsselt gespeicherten Connector-Token wieder entschlüsselt.
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      # Automatische Pruefungen (src/lib/testRun.ts): derselbe generische
      # Runner wie die Frontend-Vorschau (node+npm, richtige UID fuers
      # Workspace-Volume) – kein eigenes Netz noetig, der Lauf ist synchron
      # ("docker run" ohne "-d") und muss von niemandem erreicht werden.
      TEST_RUNNER_IMAGE: scrumy-preview-runner
      TEST_RUNNER_WORKSPACE_VOLUME: scrumy_scrumy_workspaces
      # Browser-Pruefung des Umsetzer-Agenten (src/lib/browserCheck.ts): echter
      # Chromium gegen den laufenden Compose-Stack. Eigenes Image, weil der
      # Runner oben bewusst nur node+npm enthaelt.
      BROWSER_RUNNER_IMAGE: scrumy-browser-runner
    volumes:
      # Schreibend: hier committen die Agenten.
      - scrumy_workspaces:/workspaces
      # Fuer die automatischen Pruefungen: startet Sibling-Container auf
      # demselben Docker-Host, wie "app" es fuer die Vorschau tut (siehe dort
      # fuer die Abwaegung dieses Zugriffs).
      - /var/run/docker.sock:/var/run/docker.sock

  # Kein laufender Dienst, nur ein Image: die generische Laufzeit fuer JEDE
  # Frontend-Vorschau (siehe docker/preview-runner.Dockerfile). "app" startet
  # daraus pro laufender Vorschau einen eigenen Container per Docker-API, das
  # hier baut/aktualisiert nur das Image dafuer:
  #   docker compose build preview-runner
  preview-runner:
    build:
      context: .
      dockerfile: docker/preview-runner.Dockerfile
    image: scrumy-preview-runner
    profiles: ["build-only"]

  # Ebenfalls kein laufender Dienst, nur ein Image: der Chromium fuer das
  # "check_in_browser"-Werkzeug (siehe docker/browser-runner.Dockerfile). Der
  # Worker startet daraus pro Pruefung einen eigenen Container:
  #   docker compose build browser-runner
  browser-runner:
    build:
      context: .
      dockerfile: docker/browser-runner.Dockerfile
    image: scrumy-browser-runner
    profiles: ["build-only"]

volumes:
  # Explizit an die schon bestehenden, echten Volume-Namen gepinnt
  # (`docker volume ls`), NICHT an die kurzen Compose-Schluessel unten
  # (`external: true` heisst: Compose legt sie nie an oder loescht sie,
  # sondern nutzt nur, was schon da ist). Grund: ohne "external" wuerde ein
  # anderer Projektname (z.B. nach einem Verzeichnis-Umzug) einen NEUEN,
  # leeren Volume-Namen ergeben – und die ganze Datenbank samt allen
  # Kunden-Repos schiene "verschwunden". PREVIEW_WORKSPACE_VOLUME oben
  # referenziert denselben festen Namen.
  scrumy_db_data:
    external: true
    name: scrumy_scrumy_db_data
  scrumy_workspaces:
    external: true
    name: scrumy_scrumy_workspaces
  # NICHT external (siehe Kommentar am "ollama"-Service oben) - Compose legt
  # es beim ersten Start selbst an.
  ollama_data:

networks:
  # Eigenes Netz fuer die Frontend-Vorschau: nur "app" und die Vorschau-
  # Container sind hier drin, NICHT "db" oder "worker" – ein Vorschau-
  # Container (generierter, potenziell fehlerhafter Code) kommt damit
  # netzwerkseitig nicht an die Datenbank oder die Agenten-Arbeit heran.
  # Fester Name (statt vom Projektnamen abgeleitet), damit "docker run
  # --network" in src/lib/preview.ts nicht raten muss.
  scrumy_preview:
    name: scrumy_preview
